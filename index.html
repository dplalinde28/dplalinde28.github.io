  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

        const bytes = new Uint8Array(binaryStr.length);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

sans-serif}\n:root{--bg:#121212;--bg2:#1C1C1C;--card:#1A1A1A;--line:rgba(249,246,231,0.14);--line2:rgba(249,246,231,0.08);--ink:#F9F6E7;--ink2:rgba(249,246,231,0.72);--ink3:rgba(249,246,231,0.46);--accent:#E15050;--amber:#F8B335;--chip:rgba(249,246,231,0.06)}\n[data-theme=\"light\"]{--bg:#FAFAF8;--bg2:#FFFFFF;--card:#FFFFFF;--line:#E0DED6;--line2:#ECEAE3;--ink:#1B1A17;--ink2:#5D5A52;--ink3:#8F8B80;--accent:#D63E3E;--amber:#B26F14;--chip:#F1EFE8}\na{color:var(--accent)}a:hover{color:var(--amber)}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-theme=\"{{ theme }}\" style=\"background:var(--bg);color:var(--ink);min-height:100vh;transition:background 0.3s,color 0.3s\">\n\n<nav data-screen-label=\"Nav\" style=\"position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:12px clamp(16px,4vw,40px);border-bottom:1px solid var(--line2);background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(12px)\">\n  <a href=\"#top\" style=\"font-family:'Space Grotesk';font-weight:700;font-size:16px;letter-spacing:-0.02em;color:var(--ink);text-decoration:none\">daniela.<\u002Fa>\n  <sc-if value=\"{{ isDesktop }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:flex;gap:2px;align-items:center;flex-wrap:wrap\">\n    <a href=\"#cases\" style=\"font-family:'Space Grotesk';font-size:13px;color:var(--ink2);text-decoration:none;padding:7px 12px\">{{ navCases }}<\u002Fa>\n    <a href=\"#earlier\" style=\"font-family:'Space Grotesk';font-size:13px;color:var(--ink2);text-decoration:none;padding:7px 12px\">{{ navEarlier }}<\u002Fa>\n    <a href=\"#about\" style=\"font-family:'Space Grotesk';font-size:13px;color:var(--ink2);text-decoration:none;padding:7px 12px\">{{ navAbout }}<\u002Fa>\n    <button sc-camel-on-click=\"{{ toggleLang }}\" style=\"font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:0.06em;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;margin-left:6px\">{{ langLabel }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:0.06em;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer\">{{ themeLabel }}<\u002Fbutton>\n    <a href=\"#contact\" style=\"font-family:'Space Grotesk';font-size:13px;font-weight:600;color:var(--bg);background:var(--ink);padding:8px 18px;border-radius:999px;text-decoration:none;margin-left:clamp(16px,2.5vw,24px)\">{{ navContact }}<\u002Fa>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;align-items:center;gap:8px\">\n    <button sc-camel-on-click=\"{{ toggleLang }}\" style=\"font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:0.06em;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:999px;padding:11px 16px;cursor:pointer\">{{ langLabel }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Menu\" style=\"width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:transparent;border:1px solid var(--line);border-radius:12px;cursor:pointer;padding:0\">\n      <span style=\"display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;transition:transform 0.25s;transform:{{ bar1Transform }}\"><\u002Fspan>\n      <span style=\"display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;transition:opacity 0.2s;opacity:{{ bar2Opacity }}\"><\u002Fspan>\n      <span style=\"display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;transition:transform 0.25s;transform:{{ bar3Transform }}\"><\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fnav>\n<sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Mobile menu\" style=\"position:fixed;inset:0;z-index:49;background:color-mix(in srgb, var(--bg) 96%, transparent);backdrop-filter:blur(16px);display:flex;flex-direction:column;padding:96px clamp(24px,7vw,40px) 40px\">\n  <div style=\"display:flex;flex-direction:column;gap:4px\">\n    <a href=\"#cases\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"font-family:'Archivo';font-weight:800;font-size:32px;letter-spacing:-0.03em;color:var(--ink);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line2)\">{{ navCases }}<\u002Fa>\n    <a href=\"#earlier\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"font-family:'Archivo';font-weight:800;font-size:32px;letter-spacing:-0.03em;color:var(--ink);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line2)\">{{ navEarlier }}<\u002Fa>\n    <a href=\"#about\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"font-family:'Archivo';font-weight:800;font-size:32px;letter-spacing:-0.03em;color:var(--ink);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line2)\">{{ navAbout }}<\u002Fa>\n    <a href=\"#contact\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"font-family:'Archivo';font-weight:800;font-size:32px;letter-spacing:-0.03em;color:var(--accent);text-decoration:none;padding:12px 0\">{{ navContact }}<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:16px\">\n    <button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"font-family:'JetBrains Mono';font-size:11px;letter-spacing:0.06em;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:999px;padding:12px 20px;cursor:pointer\">{{ themeLabel }}<\u002Fbutton>\n    <span style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.06em;color:var(--ink3)\">BOGOTÁ, COLOMBIA<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<header id=\"top\" data-screen-label=\"Hero\" style=\"max-width:1060px;margin:0 auto;padding:clamp(32px,5vw,56px) clamp(16px,5vw,40px) clamp(20px,3vw,28px)\">\n  <div style=\"display:{{ enBlock }}\">\n    <p style=\"font-family:'JetBrains Mono';font-size:11px;letter-spacing:0.16em;color:var(--amber);text-transform:uppercase;margin:0 0 18px\">Strategy and insights · Bogotá, Colombia<\u002Fp>\n    <h1 style=\"font-family:'Archivo';font-weight:800;font-size:clamp(30px,4.6vw,52px);line-height:1.06;letter-spacing:-0.03em;color:var(--ink);margin:0;max-width:860px;text-wrap:balance\">I turn market data into business decisions<span style=\"color:var(--accent)\">.<\u002Fspan><\u002Fh1>\n    <p style=\"font-size:16px;line-height:1.6;color:var(--ink2);max-width:680px;margin:18px 0 0;text-wrap:pretty\">Strategy and insights professional. Co-founder of Blackdog, where creator performance and sponsorship data drive pricing, sales, and content decisions for 20 motorsports YouTube creators.<\u002Fp>\n    <div style=\"display:flex;gap:14px;align-items:center;margin-top:24px;flex-wrap:wrap\">\n      <a href=\"Daniela_Perez_EN_CV.pdf\" download=\"Daniela_Perez_EN_CV.pdf\" style=\"font-family:'Space Grotesk';font-size:13.5px;font-weight:600;color:var(--bg);background:var(--ink);padding:11px 22px;border-radius:999px;text-decoration:none\">Download CV<\u002Fa>\n      <a href=\"mailto:dplalinde@gmail.com\" style=\"font-family:'Space Grotesk';font-size:13.5px;font-weight:600;color:var(--ink);border:1px solid var(--line);padding:10px 22px;border-radius:999px;text-decoration:none\">Email me<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:{{ esBlock }}\">\n    <p style=\"font-family:'JetBrains Mono';font-size:11px;letter-spacing:0.16em;color:var(--amber);text-transform:uppercase;margin:0 0 18px\">Estrategia e insights · Bogotá, Colombia<\u002Fp>\n    <h1 style=\"font-family:'Archivo';font-weight:800;font-size:clamp(30px,4.6vw,52px);line-height:1.06;letter-spacing:-0.03em;color:var(--ink);margin:0;max-width:860px;text-wrap:balance\">Convierto datos de mercado en decisiones de negocio<span style=\"color:var(--accent)\">.<\u002Fspan><\u002Fh1>\n    <p style=\"font-size:16px;line-height:1.6;color:var(--ink2);max-width:680px;margin:18px 0 0;text-wrap:pretty\">Profesional de estrategia e insights. Cofundadora de Blackdog, donde los datos de desempeño de creadores y de patrocinios guían las decisiones de precios, ventas y contenido para 20 creadores de YouTube de deportes de motor.<\u002Fp>\n    <div style=\"display:flex;gap:14px;align-items:center;margin-top:24px;flex-wrap:wrap\">\n      <a href=\"Daniela_Perez_EN_CV.pdf\" download=\"Daniela_Perez_EN_CV.pdf\" style=\"font-family:'Space Grotesk';font-size:13.5px;font-weight:600;color:var(--bg);background:var(--ink);padding:11px 22px;border-radius:999px;text-decoration:none\">Descargar CV<\u002Fa>\n      <a href=\"mailto:dplalinde@gmail.com\" style=\"font-family:'Space Grotesk';font-size:13.5px;font-weight:600;color:var(--ink);border:1px solid var(--line);padding:10px 22px;border-radius:999px;text-decoration:none\">Escríbeme<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div data-screen-label=\"Metrics\" style=\"max-width:1060px;margin:0 auto;padding:0 clamp(16px,5vw,40px) clamp(44px,7vw,72px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden\">\n    <div style=\"background:var(--bg2);padding:20px 22px\"><p style=\"font-family:'Archivo';font-weight:800;font-size:clamp(26px,3vw,34px);letter-spacing:-0.02em;color:var(--ink);margin:0\">US$2.3M<\u002Fp><p style=\"font-family:'JetBrains Mono';font-size:10px;line-height:1.5;letter-spacing:0.08em;color:var(--ink3);margin:8px 0 0;text-transform:uppercase\">{{ m1 }}<\u002Fp><\u002Fdiv>\n    <div style=\"background:var(--bg2);padding:20px 22px\"><p style=\"font-family:'Archivo';font-weight:800;font-size:clamp(26px,3vw,34px);letter-spacing:-0.02em;color:var(--ink);margin:0\">90<\u002Fp><p style=\"font-family:'JetBrains Mono';font-size:10px;line-height:1.5;letter-spacing:0.08em;color:var(--ink3);margin:8px 0 0;text-transform:uppercase\">{{ m2 }}<\u002Fp><\u002Fdiv>\n    <div style=\"background:var(--bg2);padding:20px 22px\"><p style=\"font-family:'Archivo';font-weight:800;font-size:clamp(26px,3vw,34px);letter-spacing:-0.02em;color:var(--ink);margin:0\">106M+<\u002Fp><p style=\"font-family:'JetBrains Mono';font-size:10px;line-height:1.5;letter-spacing:0.08em;color:var(--ink3);margin:8px 0 0;text-transform:uppercase\">{{ m3 }}<\u002Fp><\u002Fdiv>\n    <div style=\"background:var(--bg2);padding:20px 22px\"><p style=\"font-family:'Archivo';font-weight:800;font-size:clamp(26px,3vw,34px);letter-spacing:-0.02em;color:var(--ink);margin:0\">2.9x<\u002Fp><p style=\"font-family:'JetBrains Mono';font-size:10px;line-height:1.5;letter-spacing:0.08em;color:var(--ink3);margin:8px 0 0;text-transform:uppercase\">{{ m4 }}<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section id=\"cases\" data-screen-label=\"Cases\" style=\"max-width:1060px;margin:0 auto;padding:0 clamp(16px,5vw,40px) clamp(48px,8vw,84px);display:grid;gap:20px\">\n\n  <article data-screen-label=\"Case 01 Pricing\" style=\"border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg2)\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line2);flex-wrap:wrap;gap:8px\">\n      <span style=\"font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:0.12em;color:var(--accent)\">{{ c1Label }}<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.06em;color:var(--ink3)\">BLACKDOG<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:{{ enBlock }};padding:clamp(22px,3.5vw,32px) clamp(18px,3vw,28px)\">\n      <h3 style=\"font-family:'Archivo';font-weight:800;font-size:clamp(22px,2.6vw,28px);letter-spacing:-0.03em;line-height:1.1;margin:0\">Pricing and sales insights<\u002Fh3>\n      <p style=\"font-size:15px;line-height:1.55;color:var(--ink2);margin:10px 0 0\"><span style=\"font-family:'Space Grotesk';font-weight:700;color:var(--accent)\">2.9x<\u002Fspan> annual signed deal value, 2023 to 2025. Business results over the same period.<\u002Fp>\n      <div style=\"display:grid;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin-top:20px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">THE QUESTION<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink);margin:0\">Which creators and formats are underpriced, and where are the next sponsors?<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">WHAT THE DATA SHOWED<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Creator performance dashboards, built with engineering, tracked views, engagement and watch time. Read against CPM based pricing, they showed where rates sat below what the audience delivered. A sponsorship inventory view showed which slots and formats were still open.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">THE DECISION<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Adjust pricing where the gap was clear, point sales at open inventory, and shape content toward the formats that performed.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--amber);margin:3px 0 0\">THE RESULT<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Business results over the same period: annual signed deal value grew 2.9x from 2023 to 2025. Average deal value doubled from US$4.9K to US$9.9K, 2023 to 2026. 48 of 90 brand partners signed repeat deals. 60 active deals across 30 brands today.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:{{ esBlock }};padding:clamp(22px,3.5vw,32px) clamp(18px,3vw,28px)\">\n      <h3 style=\"font-family:'Archivo';font-weight:800;font-size:clamp(22px,2.6vw,28px);letter-spacing:-0.03em;line-height:1.1;margin:0\">Insights de precios y ventas<\u002Fh3>\n      <p style=\"font-size:15px;line-height:1.55;color:var(--ink2);margin:10px 0 0\"><span style=\"font-family:'Space Grotesk';font-weight:700;color:var(--accent)\">2.9x<\u002Fspan> en valor anual de acuerdos firmados, 2023 a 2025. Resultados del negocio en el mismo periodo.<\u002Fp>\n      <div style=\"display:grid;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin-top:20px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">LA PREGUNTA<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink);margin:0\">¿Qué creadores y formatos están por debajo de su precio, y dónde están los próximos patrocinadores?<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">QUÉ MOSTRARON LOS DATOS<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Dashboards de desempeño de creadores, construidos con ingeniería, siguieron vistas, engagement y tiempo de visualización. Leídos frente a precios basados en CPM, mostraron dónde las tarifas estaban por debajo de lo que entregaba la audiencia. Una vista del inventario de patrocinios mostró qué espacios y formatos seguían abiertos.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">LA DECISIÓN<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Ajustar precios donde la brecha era clara, enfocar ventas en el inventario abierto y orientar el contenido hacia los formatos con mejor desempeño.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--amber);margin:3px 0 0\">EL RESULTADO<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Resultados del negocio en el mismo periodo: el valor anual de acuerdos firmados creció 2.9x de 2023 a 2025. El valor promedio por acuerdo se duplicó de US$4.9K a US$9.9K, 2023 a 2026. 48 de 90 marcas aliadas firmaron acuerdos recurrentes. 60 acuerdos activos con 30 marcas hoy.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <article data-screen-label=\"Case 02 Creator Grand Prix\" style=\"border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg2)\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line2);flex-wrap:wrap;gap:8px\">\n      <span style=\"font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:0.12em;color:var(--accent)\">{{ c2Label }}<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.06em;color:var(--ink3)\">{{ c2Meta }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:{{ enBlock }};padding:clamp(22px,3.5vw,32px) clamp(18px,3vw,28px)\">\n      <h3 style=\"font-family:'Archivo';font-weight:800;font-size:clamp(22px,2.6vw,28px);letter-spacing:-0.03em;line-height:1.1;margin:0\">Creator Grand Prix 2025<\u002Fh3>\n      <p style=\"font-size:15px;line-height:1.55;color:var(--ink2);margin:10px 0 0\"><span style=\"font-family:'Space Grotesk';font-weight:700;color:var(--accent)\">3.1M views<\u002Fspan> and 1,190 active participants across the U.S., from 79 videos.<\u002Fp>\n      <div style=\"display:grid;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin-top:20px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">THE QUESTION<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink);margin:0\">How do we get audiences to watch full videos, not just click?<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">WHAT THE DATA SHOWED<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">A view count alone did not show whether the audience stayed for the sponsor's message. Watch time and participation were the signals the partners cared about.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">THE DECISION<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Place participation codes inside videos longer than 10 minutes, so taking part meant watching the full video. The campaign ran across several partners and creators.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--amber);margin:3px 0 0\">THE RESULT<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">79 videos, 3.1M views, 1,190 active participants across the U.S., 137K likes and 4.44% average engagement. I measured the results and reported them to the brand partners.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:{{ esBlock }};padding:clamp(22px,3.5vw,32px) clamp(18px,3vw,28px)\">\n      <h3 style=\"font-family:'Archivo';font-weight:800;font-size:clamp(22px,2.6vw,28px);letter-spacing:-0.03em;line-height:1.1;margin:0\">Creator Grand Prix 2025<\u002Fh3>\n      <p style=\"font-size:15px;line-height:1.55;color:var(--ink2);margin:10px 0 0\"><span style=\"font-family:'Space Grotesk';font-weight:700;color:var(--accent)\">3.1M de vistas<\u002Fspan> y 1,190 participantes activos en Estados Unidos, a partir de 79 videos.<\u002Fp>\n      <div style=\"display:grid;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin-top:20px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">LA PREGUNTA<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink);margin:0\">¿Cómo logramos que la audiencia vea los videos completos y no solo haga clic?<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">QUÉ MOSTRARON LOS DATOS<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Un conteo de vistas no mostraba si la audiencia se quedaba hasta el mensaje del patrocinador. El tiempo de visualización y la participación eran las señales que les importaban a los aliados.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">LA DECISIÓN<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Poner códigos de participación dentro de videos de más de 10 minutos, para que participar implicara ver el video completo. La campaña corrió con varios aliados y creadores.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--amber);margin:3px 0 0\">EL RESULTADO<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">79 videos, 3.1M de vistas, 1,190 participantes activos en Estados Unidos, 137K likes y 4.44% de engagement promedio. Medí los resultados y los reporté a las marcas aliadas.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <article data-screen-label=\"Case 03 Market intelligence\" style=\"border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg2)\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line2);flex-wrap:wrap;gap:8px\">\n      <span style=\"font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:0.12em;color:var(--accent)\">{{ c3Label }}<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.06em;color:var(--ink3)\">{{ c3Meta }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:{{ enBlock }};padding:clamp(22px,3.5vw,32px) clamp(18px,3vw,28px)\">\n      <h3 style=\"font-family:'Archivo';font-weight:800;font-size:clamp(22px,2.6vw,28px);letter-spacing:-0.03em;line-height:1.1;margin:0\">Market intelligence<\u002Fh3>\n      <p style=\"font-size:15px;line-height:1.55;color:var(--ink2);margin:10px 0 0\"><span style=\"font-family:'Space Grotesk';font-weight:700;color:var(--accent)\">84 sponsoring brands<\u002Fspan> surfaced as prospects from 585 videos analyzed.<\u002Fp>\n      <div style=\"display:grid;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin-top:20px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">THE QUESTION<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink);margin:0\">Which brands already sponsor motorsports creators, and which of them aren't working with us yet?<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">WHAT THE DATA SHOWED<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Sponsorships are public on YouTube, but spread across hundreds of videos and channels, with no single list of who sponsors whom.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">THE DECISION<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Build a tool, with engineering, on the YouTube Data API and the Anthropic API that detects sponsorships in YouTube videos and compares the brands found with our current partners.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--amber);margin:3px 0 0\">THE RESULT<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">585 videos analyzed, 84 sponsoring brands surfaced as prospects for the sales team.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:{{ esBlock }};padding:clamp(22px,3.5vw,32px) clamp(18px,3vw,28px)\">\n      <h3 style=\"font-family:'Archivo';font-weight:800;font-size:clamp(22px,2.6vw,28px);letter-spacing:-0.03em;line-height:1.1;margin:0\">Inteligencia de mercado<\u002Fh3>\n      <p style=\"font-size:15px;line-height:1.55;color:var(--ink2);margin:10px 0 0\"><span style=\"font-family:'Space Grotesk';font-weight:700;color:var(--accent)\">84 marcas patrocinadoras<\u002Fspan> identificadas como prospectos a partir de 585 videos analizados.<\u002Fp>\n      <div style=\"display:grid;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin-top:20px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">LA PREGUNTA<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink);margin:0\">¿Qué marcas ya patrocinan a creadores de deportes de motor, y cuáles todavía no trabajan con nosotros?<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">QUÉ MOSTRARON LOS DATOS<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Los patrocinios son públicos en YouTube, pero están repartidos en cientos de videos y canales, sin una lista única de quién patrocina a quién.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--ink3);margin:3px 0 0\">LA DECISIÓN<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">Construir con ingeniería una herramienta sobre la YouTube Data API y la Anthropic API que detecta patrocinios en videos de YouTube y compara las marcas encontradas con nuestros aliados actuales.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 24px;background:var(--card);padding:16px 18px\"><p style=\"flex:0 0 190px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:0.1em;color:var(--amber);margin:3px 0 0\">EL RESULTADO<\u002Fp><p style=\"flex:1 1 300px;font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0\">585 videos analizados, 84 marcas patrocinadoras identificadas como prospectos para el equipo comercial.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <article data-screen-label=\"Case 04 Blackdog OS\" style=\"border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg2)\">\n    <div 02Fp>\n      <p style=\"font-size:14.5px;line-height:1.8;color:var(--ink2);margin:14px 0 0\"><a href=\"mailto:dplalinde@gmail.com\" style=\"color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)\">dplalinde@gmail.com<\u002Fa><span style=\"color:var(--ink3)\"> · Bogotá, Colombia · <\u002Fspan><a href=\"https://www.linkedin.com/in/daniela-perez-lalinde\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)\">LinkedIn ↗<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n      <a href=\"Daniela_Perez_EN_CV.pdf\" download=\"Daniela_Perez_EN_CV.pdf\" style=\"font-family:'Space Grotesk';font-size:13.5px;font-weight:600;color:var(--bg);background:var(--ink);padding:11px 22px;border-radius:999px;text-decoration:none\">{{ cvLabel }}<\u002Fa>\n      <a href=\"mailto:dplalinde@gmail.com\" style=\"font-family:'Space Grotesk';font-size:13.5px;font-weight:600;color:var(--ink);border:1px solid var(--line);padding:10px 22px;border-radius:999px;text-decoration:none\">{{ emailLabel }}<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;es&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en'|'es'&quot;,&quot;section&quot;:&quot;Language&quot;},&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;,&quot;section&quot;:&quot;Appearance&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    theme: (typeof localStorage !== 'undefined' && localStorage.getItem('dpl-theme')) || null,\n    lang: (typeof localStorage !== 'undefined' && localStorage.getItem('dpl-lang')) || null,\n    menuOpen: false,\n    vw: typeof window !== 'undefined' ? window.innerWidth : 1200\n  };\n  componentDidMount() {\n    this._onResize = () => this.setState({ vw: window.innerWidth });\n    window.addEventListener('resize', this._onResize);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }\n  renderVals() {\n    const theme = this.state.theme || this.props.defaultTheme || 'dark';\n    const lang = this.state.lang || this.props.defaultLang || 'en';\n    const en = lang === 'en';\n    const isMobile = this.state.vw <= 720;\n    const open = this.state.menuOpen && isMobile;\n    const t = (a, b) => (en ? a : b);\n    return {\n      isMobile, isDesktop: !isMobile, menuOpen: open, theme, lang,\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      bar1Transform: open ? 'translateY(7px) rotate(45deg)' : 'none',\n      bar2Opacity: open ? 0 : 1,\n      bar3Transform: open ? 'translateY(-7px) rotate(-45deg)' : 'none',\n      enBlock: en ? 'block' : 'none', esBlock: en ? 'none' : 'block',\n      enGrid: en ? 'grid' : 'none', esGrid: en ? 'none' : 'grid',\n      langLabel: en ? 'ES' : 'EN',\n      themeLabel: theme === 'dark' ? t('LIGHT MODE', 'MODO CLARO') : t('DARK MODE', 'MODO OSCURO'),\n      navCases: t('cases', 'casos'), navEarlier: t('earlier work', 'trabajo anterior'), navAbout: t('about', 'sobre mí'), navContact: t('contact', 'contacto'),\n      m1: t('in signed deals since 2023', 'en acuerdos firmados desde 2023'),\n      m2: t('brand partners, 48 repeat', 'marcas aliadas, 48 recurrentes'),\n      m3: t('views delivered', 'vistas entregadas'),\n      m4: t('deal value growth, 2023 to 2025', 'crecimiento del valor de acuerdos, 2023 a 2025'),\n      c1Label: t('01 / PRICING AND SALES INSIGHTS', '01 / INSIGHTS DE PRECIOS Y VENTAS'),\n      c2Label: t('02 / AUDIENCE ATTENTION', '02 / ATENCIÓN DE LA AUDIENCIA'),\n      c2Meta: t('MULTI PARTNER CAMPAIGN · MOTORCYCLE BRAND
